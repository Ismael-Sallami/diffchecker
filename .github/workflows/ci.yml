name: tests

# The engine decides what the tool shows and what the download button writes,
# so every push runs its property checks. There is nothing to install: the
# project has no dependencies.

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

jobs:
  engine:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        node: ['20', '22']
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: ${{ matrix.node }}

      - name: Check the diff engine
        run: node tests/check-diff-engine.mjs

      # A relative path that stops resolving would only show up in a browser,
      # so it is checked here instead.
      - name: The page must not reference the site it is deployed to for its own files
        run: |
          set -euo pipefail
          if grep -nE '(href|src)="/' src/index.html; then
            echo "src/index.html has an absolute path: it would break outside the deployment"
            exit 1
          fi
